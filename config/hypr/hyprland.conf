exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once=systemctl --user start opentabletdriver

monitor = , 1920x1080@120, auto, 1 

workspace = 1
workspace = 2
workspace = 3
workspace = 4
workspace = 5
workspace = 6
workspace = 7
workspace = 8

# Keybinds

$mainMod = SUPER 

$layout = 'smartgrid'
bind = alt, C, exec, sh ~/.config/hypr/wallpaper.sh
bind = $mainMod, return, exec, alacritty
bind = $mainMod, Q, killactive,
bind = $mainMod+alt, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, E, exec, nemo
bind = $mainMod, SPACE, exec, hyprctl dispatch togglefloating; hyprctl dispatch resizeactive exact 1000 550; hyprctl dispatch centerwindow
bind = alt, Tab, cyclenext,
bind = alt, Tab, bringactivetotop,
bind = $mainMod, A, global, quickshell:toggleLauncher
bind = $mainMod, escape, global, quickshell:togglePowerMenu
bind = $mainMod, W, global, quickshell:toggleOverview
bind = ,Next, exec, sh -c 'FILE=~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png; REGION=$(slurp) && sleep 0.1 && grim -g "$REGION" "$FILE" && wl-copy < "$FILE" && notify-send "Screenshot" "Saved and copied to clipboard"'
bind = ,f12, exec, sh -c 'FILE=~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png; REGION=$(slurp) && sleep 0.1 && grim -g "$REGION" "$FILE" && wl-copy < "$FILE" && notify-send "Screenshot" "Saved and copied to clipboard"'
bind = shift,Next, exec, sh -c '~/.config/hypr/ocr.sh'
bind = shift,f12, exec, sh -c '~/.config/hypr/ocr.sh'
bind = SUPER, L, global, quickshell:triggerSessionLock
bind = $mainMod, Z, exec, killall qs
bind = $mainMod, X, exec, sh ~/.config/quickshell/mshell/launch.sh
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, s, togglespecialworkspace
bind = $mainMod+shift, s, movetoworkspacesilent, special
bind = $mainMod+shift, 1, movetoworkspacesilent, 1
bind = $mainMod+shift, 2, movetoworkspacesilent, 2
bind = $mainMod+shift, 3, movetoworkspacesilent, 3
bind = $mainMod+shift, 4, movetoworkspacesilent, 4
bind = $mainMod+shift, 5, movetoworkspacesilent, 5
bind = $mainMod+shift, 6, movetoworkspacesilent, 6
bind = $mainMod+shift, 7, movetoworkspacesilent, 7
bind = $mainMod+shift, 8, movetoworkspacesilent, 8
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mainMod,Up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod,Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindel = $mainMod,Right, exec, brightnessctl s 5%+
bindel = $mainMod,Left, exec, brightnessctl s 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , Prior, exec, playerctl play-pause
bindl = , f11, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mainMod, V, exec, copyq toggle
bindl = , XF86Calculator, exec, galculator
bind = $mainMod, P, exec, hyprpicker -a
bind = $mainMod, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')    
bind = $mainMod, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')    
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor 1
bind = $mainMod, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 + 0.5}')    
bind = $mainMod, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 - 0.5}')    
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor 1
bind = $mainMod, N, exec, /usr/local/bin/niflveil minimize
bind = $mainMod ctrl, N, exec, /usr/local/bin/niflveil restore-last

# Autostart

exec-once=copyq
exec-once=hyprsunset -t 5000
exec-once=hypridle
exec-once=awww-daemon
exec-once=awww img ~/.config/hypr/wallpaper.jpg
exec-once=discord
exec-once=kdeconnect-indicator
exec-once=zen-browser
exec-once=bash ~/.config/quickshell/launch.sh
exec-once=gsettings set org.gnome.desktop.interface cursor-theme "catppuccin-mocha-dark-cursors"
exec-once=gsettings set org.gnome.desktop.interface cursor-size 21

# Env vars

env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XCURSOR_SIZE,21
env = XCURSOR_THEME=catppuccin-mocha-dark-cursors
exec-once=hyprctl setcursor catppuccin-mocha-dark-cursors 20

# Decorations and animations

general {
    gaps_in = 5
    gaps_out = 7
    border_size = 0 
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 20
    active_opacity = 1
    inactive_opacity = 1
    shadow {
        enabled = true
        color = rgba(00000000)
        color_inactive = rgba(00000000)
    }
    blur {
        enabled = true
        size = 3
    }
}

animations {
    enabled = true, animations
    bezier = winIn, 0.1, 1.0, 0.1, 1.0
    bezier = winOut, 0.1, 1.0, 0.1, 1.0
    bezier = smoothOut, 0.5, 0, 0.99, 0.99
    bezier = layerOut,0.23,1,0.32,1
    animation = windowsIn, 1, 7, winIn, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 7, winIn, slide
    animation = workspacesIn, 1, 8, winIn, slide
    animation = workspacesOut, 1, 8, winOut, slide
    animation = layersIn, 1, 10, winIn, slide
    animation = layersOut, 1, 3, layerOut, popin 50%
}

dwindle {
    #pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}

# Input and gestures stuff

input {
    kb_layout = us
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.5 
    touchpad {
        natural_scroll = false
        disable_while_typing = true
    }
}

cursor {
    inactive_timeout = 3
    hide_on_key_press = true
}

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}
gesture = 3, horizontal, workspace
gesture = 3, down, dispatcher, exec, /usr/local/bin/niflveil minimize
gesture = 3, up, dispatcher, exec, /usr/local/bin/niflveil restore-last
gesture = 4, down, dispatcher, killactive
gesture = 4, up, dispatcher, global, quickshell:toggleLauncher

# Window rules

windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

windowrule {
  name = windowrule-3
  float = on
  size = 1100 600
  match:class = ^(yad)$
}

windowrule {
  name = windowrule-4
  float = on
  match:class = ^(xdg-desktop-portal-gtk)$
}

windowrule {
  name = windowrule-5
  float = on
  size = 1100 600
  center = on
  animation = popin 90%
  match:class = ^(com.github.hluk.copyq)
}

windowrule {
  name = windowrule-6
  workspace = 2 silent
  match:class = ^(discord)
}

windowrule {
  name = windowrule-7
  workspace = 1 silent
  match:class = ^(zen)
}

windowrule {
  name = windowrule-8
