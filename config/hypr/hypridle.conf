general {
    lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:triggerSessionLock")'
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:triggerSessionLock")' && sleep 0.8
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && sleep 2 && gsettings set org.gnome.desktop.interface cursor-size 21
}

